<main>
  <h1>Campeões</h1>

  <p *ngIf="loading" role="status">Carregando campeões...</p>
  <p *ngIf="error" role="alert">{{ error }}</p>

  <ng-container *ngIf="!loading && !error">
    <label for="champion-search">Buscar campeão pelo nome</label>
    <input
      id="champion-search"
      type="search"
      [(ngModel)]="searchTerm"
      autocomplete="off"
      aria-describedby="champion-count"
    />
    <p id="champion-count" role="status">
      {{ filteredHeroes.length }} campeão(ões) encontrado(s).
    </p>
    <p *ngIf="filteredHeroes.length === 0">Nenhum campeão corresponde à busca.</p>
    <ul *ngIf="filteredHeroes.length > 0">
      <li *ngFor="let hero of filteredHeroes">{{ hero }}</li>
    </ul>
  </ng-container>
</main>
